name: Android APK

# APK, siteyi (GitHub Pages) açan bir kabuk. Arayüz güncellemeleri APK'yı
# yeniden kurmadan gelir; bu iş akışı sadece kabuk ayarları değişince çalışır.
on:
  push:
    branches: [main]
    paths: ['capacitor.config.json', 'package.json', 'www/offline.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Bağımlılıklar
        run: npm install

      - name: Android projesi oluştur
        run: npx cap add android

      - name: Konum izinleri
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Senkronize et
        run: npx cap sync android

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../hava-hakemi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hava-hakemi-apk
          path: hava-hakemi.apk

      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Hava Hakemi APK
          make_latest: true
          files: hava-hakemi.apk
          body: |
            Telefona kurmak için aşağıdaki hava-hakemi.apk dosyasını indir.
            Uygulama arayüzü internetten güncellenir; yeni sürüm için APK'yı tekrar kurman gerekmez.
